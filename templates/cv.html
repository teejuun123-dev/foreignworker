{% extends 'base.html' %}
{% block content %}
<div class="content-page cv-download-only">
  {% if cv_available %}
    <a class="button button-solid" href="files/cv.pdf" download>Download CV (PDF) ↓</a>
  {% else %}
    <p class="notice">Add a CV at <code>files/cv.pdf</code> and run <code>build.py</code> to enable the download.</p>
  {% endif %}
</div>
{% endblock %}
